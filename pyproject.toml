[project]
name = "sonic2-mdplus-forge"
version = "0.1.0"
description = "Reproducible build system for Sonic the Hedgehog 2 MD+ soundtrack variants"
requires-python = ">=3.10"
license = "GPL-3.0-only"

[project.optional-dependencies]
lint = ["ruff>=0.9"]
emulation = ["unicorn==2.1.4", "z80==1.2.0"]

[project.scripts]
sonic2-mdplus = "tools.mdplus_builder.cli:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.package-data]
"tools.mdplus_builder" = ["*.asm"]
