name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # On pushes, compare with the previous branch tip. PRs use the PR diff.
          base: ${{ github.ref }}
          filters: |
            python:
              - '**/*.py'
              - '**/*.pyi'
              - 'pyproject.toml'
              - '**/ruff.toml'
              - '**/.ruff.toml'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '**/*.markdown'
              - '.markdownlint*'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        if: steps.changes.outputs.python == 'true'
        run: python -m pip install --disable-pip-version-check '.[lint]'
      - name: Lint Python
        if: steps.changes.outputs.python == 'true'
        run: ruff check .
      - name: Set up Node for Markdownlint
        if: steps.changes.outputs.markdown == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install Markdownlint
        if: steps.changes.outputs.markdown == 'true'
        run: npm ci --ignore-scripts
      - name: Lint Markdown
        if: steps.changes.outputs.markdown == 'true'
        run: npm run lint:markdown
      - name: Compile
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate default track manifest
        run: python -m tools.mdplus_builder validate-manifest --manifest config/tracks.json
      - name: Validate pinned source conversion
        run: |
          python -m tools.mdplus_builder bootstrap --skip-assembler-build
          python -m tools.mdplus_builder prepare-source
